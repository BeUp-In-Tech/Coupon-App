components:
  schemas:
    UserRegisterRequest:
      type: object
      required:
        - user_name
        - email
        - password
      properties:
        user_name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: StrongPassword123!
        role:
          type: string
          enum: [USER, VENDOR, ADMIN]
          example: USER

    UserUpdateRequest:
      type: object
      properties:
        user_name:
          type: string
          example: John Updated

    UserVerificationOtpRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: john@example.com

    UserVerifyProfileRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        otp:
          type: string
          example: 491739

    UserFcmTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: fcm-device-token

    UserProfileResponse:
      type: object
      properties:
        _id:
          type: string
          example: 6507c9f2a4b3c12d5e6f7890
        user_name:
          type: string
          example: John Doe
        email:
          type: string
          example: john@example.com
        isVerified:
          type: boolean
          example: true
        role:
          type: string
          example: USER
        isActive:
          type: string
          example: ACTIVE
        deviceTokens:
          type: array
          items:
            type: string
        isShopCreated:
          type: boolean
          example: false

    UserProfileSuccessEnvelope:
      type: object
      required:
        - success
        - statusCode
        - message
        - trace_id
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Fetch my details
        trace_id:
          type: string
          example: req-trace-id
        data:
          $ref: '#/components/schemas/UserProfileResponse'

    UserGenericSuccessEnvelope:
      type: object
      required:
        - success
        - statusCode
        - message
        - trace_id
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operation completed successfully
        trace_id:
          type: string
          example: req-trace-id
        data:
          nullable: true
          example: null

    UserDeviceListEnvelope:
      type: object
      required:
        - success
        - statusCode
        - message
        - trace_id
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Push device list fetched
        trace_id:
          type: string
          example: req-trace-id
        data:
          type: array
          items:
            type: string
          example:
            - fcm-device-token-1
            - fcm-device-token-2

  responses:
    UserRegisterSuccessResponse:
      description: User account created successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileSuccessEnvelope'
    UserSuccessResponse:
      description: Successful user operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileSuccessEnvelope'
    UserGenericSuccessResponse:
      description: Operation completed successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserGenericSuccessEnvelope'
    UserDeleteResponse:
      description: Account deleted successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserGenericSuccessEnvelope'
    UserDeviceListSuccessResponse:
      description: Registered device tokens returned successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserDeviceListEnvelope'
