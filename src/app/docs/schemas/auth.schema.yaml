components:
  schemas:
    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: example@gmail.com
        password:
          type: string
          example: dfR234@Dkk

    AuthChangePassword:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          example: thisIs@oldPassword
        newPassword:
          type: string
          example: thisIs@newPassword

    AuthVerifyOtpRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          example: example@gmail.com
        otp:
          type: string
          example: 491739

    AuthResetPasswordRequest:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          example: NewStrongPassword@123

    AuthRefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: your_refresh_token_here

    AuthSocialLoginRequest:
      type: object
      properties:
        id_token:
          type: string
          example: google_id_token
        code:
          type: string
          example: apple_authorization_code
        user_name:
          type: string
          example: John Doe
        email:
          type: string
          example: example@gmail.com

    AuthLoginSuccessResponse:
      type: object
      required:
        - success
        - statusCode
        - message
        - trace_id
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Login success
        trace_id:
          type: string
          example: req-trace-id
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: access-token
            refreshToken:
              type: string
              example: refresh-token

    AuthGenericSuccessResponse:
      type: object
      required:
        - success
        - statusCode
        - message
        - trace_id
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operation completed successfully
        trace_id:
          type: string
          example: req-trace-id
        data:
          nullable: true
          example: null

  responses:
    LoginSuccess:
      description: Login completed successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLoginSuccessResponse'
    SuccessWithNull:
      description: Operation completed successfully and returned no payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthGenericSuccessResponse'
    SuccessWithData:
      description: Authentication response with access and refresh tokens.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLoginSuccessResponse'
