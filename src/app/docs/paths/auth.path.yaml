AuthApi:
  post:
    tags:
      - Auth
    summary: "User login to the apps/website"
    description: "Login to application using email and password. If authenticated user, you will get an access token to navigate and access all private routes"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.schema.yaml#/components/schemas/AuthLoginRequest'
    responses:
      '200':
        $ref: '../schemas/auth.schema.yaml#/components/responses/LoginSuccess'
      '401':
        $ref: '../components.yaml#/components/responses/unauthorizeResponse'

ChangePasswordApi:
  post:
    tags:
      - Auth
    security:
      - bearerAuth: []
    summary: Password change
    description: Authenticated user can change password by this route
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.schema.yaml#/components/schemas/AuthChangePassword'
    responses:
      '200':
        $ref: '../schemas/auth.schema.yaml#/components/responses/SuccessWithNull'
      '401': 
        $ref: '../components.yaml#/components/responses/unauthorizeResponse'
      '400': 
        $ref: '../components.yaml#/components/responses/badRequestResponse'

ForgetPasswordApi:
  get:
    tags:
      - Auth
    summary: Forget password
    description: User can change password by forget password api by sending otp verification code
    parameters:
      - in: path
        name: email
        schema:
          type: integer
        required: true
        description: Email for sending otp to verification 
    responses:
      '200':
        $ref: '../schemas/auth.schema.yaml#/components/responses/SuccessWithNull'
      '401': 
        $ref: '../components.yaml#/components/responses/unauthorizeResponse'
      '400': 
        $ref: '../components.yaml#/components/responses/badRequestResponse'





















