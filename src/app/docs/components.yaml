components:
  schemas:
    successEnvelope:
      type: object
      required:
        - success
        - statusCode
        - message
        - trace_id
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operation completed successfully
        trace_id:
          type: string
          example: req-trace-id
        data:
          nullable: true
          example: null
    unauthorizedError:
      type: object
      required:
        - success
        - statusCode
        - message
        - trace_id
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 401
        message:
          type: string
          example: Unauthorized access
        trace_id:
          type: string
          example: req-trace-id
        errorSources:
          type: array
          items:
            type: object
          example: []
        err:
          nullable: true
          example: null
        stack:
          nullable: true
          example: null
    badRequestError:
      type: object
      required:
        - success
        - statusCode
        - message
        - trace_id
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid request payload
        trace_id:
          type: string
          example: req-trace-id
        errorSources:
          type: array
          items:
            type: object
          example: []
        err:
          nullable: true
          example: null
        stack:
          nullable: true
          example: null
    notFoundError:
      type: object
      required:
        - success
        - statusCode
        - message
        - trace_id
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource not found
        trace_id:
          type: string
          example: req-trace-id
        errorSources:
          type: array
          items:
            type: object
          example: []
        err:
          nullable: true
          example: null
        stack:
          nullable: true
          example: null
    rateLimitError:
      allOf:
        - $ref: '#/components/schemas/badRequestError'
        - type: object
          properties:
            statusCode:
              example: 429
            message:
              example: Too many requests, please try again later.
    serverError:
      allOf:
        - $ref: '#/components/schemas/badRequestError'
        - type: object
          properties:
            statusCode:
              example: 500
            message:
              example: Internal server error
  responses:
    successResponse:
      description: Standard success envelope returned by the API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/successEnvelope'
    createdResponse:
      description: Resource created successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/successEnvelope'
    unauthorizeResponse:
      description: Authentication failed or token missing/invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/unauthorizedError'
    badRequestResponse:
      description: Validation or business-rule error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/badRequestError'
    notFoundResponse:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/notFoundError'
    rateLimitResponse:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/rateLimitError'
    serverErrorResponse:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/serverError'
